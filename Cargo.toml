[package]
name = "iriswall"
version = "0.1.0"
edition = "2021"
description = "Лёгкий демон обоев для Hyprland: layer-shell + EGL/GLES3, переход «круг из центра»"

[dependencies]
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-egl = "0.32"
khronos-egl = { version = "6", features = ["static"] }
gl = "0.14"
calloop = "0.13"
calloop-wayland-source = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
